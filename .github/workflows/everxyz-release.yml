# Builds everxyz OCCT binaries when an everxyz-release-* or everxyz-dev-* tag is pushed.
#
#   everxyz-release-*  ->  Release build (optimized)
#   everxyz-dev-*      ->  Debug build (assertions, debug symbols)
#
# Targets are Windows x64 (native MSVC) and Linux amd64 (x86_64 in a container).
# Both are native builds on the self-hosted runner labelled 'everxyz-win'.
#
# Deliberately uses no external actions: the repository's Actions policy is set to
# allow only everxyz-owned actions, so actions/checkout and friends are blocked.
# Checkout, archiving and release upload are done with git, tar and the REST API.

name: everxyz Build

on:
  push:
    tags:
      - 'everxyz-release-*'
      - 'everxyz-dev-*'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode when run manually'
        type: choice
        options: [Release, Debug]
        default: Release
      targets:
        description: 'Which targets to build'
        type: choice
        options: [both, windows-x64, linux-amd64]
        default: both

permissions:
  contents: write

concurrency:
  group: everxyz-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 'shell: bash' resolves via PATH, where C:\Windows\System32\bash.exe (the WSL
    # launcher) wins on this runner. WSL distros are registered per-user and none
    # exist for the service account, so that bash fails immediately. Point at Git
    # Bash explicitly. -e and -o pipefail match what 'shell: bash' would apply.
    shell: 'C:\Program Files\Git\bin\bash.exe -eo pipefail {0}'

jobs:
  setup:
    name: Resolve build mode
    runs-on: [self-hosted, everxyz-win]
    if: github.repository != 'Open-Cascade-SAS/OCCT'
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      build_windows: ${{ steps.resolve.outputs.build_windows }}
      build_linux: ${{ steps.resolve.outputs.build_linux }}
    steps:
      - name: Resolve mode and version from tag
        id: resolve
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'

          case "$ref" in
            everxyz-release-*) mode=Release; version="${ref#everxyz-release-}" ;;
            everxyz-dev-*)     mode=Debug;   version="${ref#everxyz-dev-}" ;;
            *)
              # workflow_dispatch on a branch: fall back to the chosen input.
              mode='${{ inputs.build_mode }}'
              mode="${mode:-Release}"
              version="manual-${GITHUB_SHA::8}"
              ;;
          esac

          want='${{ inputs.targets }}'
          case "${want:-both}" in
            windows-x64) win=true;  lnx=false ;;
            linux-amd64) win=false; lnx=true  ;;
            *)           win=true;  lnx=true  ;;
          esac

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "build_windows=$win"
            echo "build_linux=$lnx"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## everxyz build"
            echo "- tag/ref: \`$ref\`"
            echo "- mode: **$mode**"
            echo "- version: \`$version\`"
            echo "- windows-x64: $win"
            echo "- linux-amd64: $lnx"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    name: Windows x64 (${{ needs.setup.outputs.mode }})
    needs: setup
    if: needs.setup.outputs.build_windows == 'true'
    runs-on: [self-hosted, everxyz-win]
    env:
      MODE: ${{ needs.setup.outputs.mode }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout at ref
        run: |
          set -euo pipefail
          rm -rf src-win && mkdir src-win && cd src-win
          git init --quiet
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S src-win -B build-win -G "Visual Studio 17 2022" -A x64 `
            -D CMAKE_BUILD_TYPE=$env:MODE `
            -D BUILD_LIBRARY_TYPE=Shared `
            -D BUILD_CPP_STANDARD=C++17 `
            -D BUILD_MODULE_Draw=OFF `
            -D BUILD_DOC_Overview=OFF `
            -D USE_FREETYPE=OFF `
            -D USE_TK=OFF `
            -D USE_OPENGL=ON `
            -D INSTALL_DIR="$PWD/install-win"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-win --target install --config $env:MODE --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          set -euo pipefail
          name="occt-${VERSION}-windows-x64-$(echo "$MODE" | tr '[:upper:]' '[:lower:]')"
          tar -czf "${name}.tar.gz" -C install-win .
          echo "Created ${name}.tar.gz ($(du -h "${name}.tar.gz" | cut -f1))"
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src-win/.github/scripts/upload-release-asset.sh "$ARCHIVE"

  linux-amd64:
    name: Linux amd64 (${{ needs.setup.outputs.mode }})
    needs: setup
    if: needs.setup.outputs.build_linux == 'true'
    runs-on: [self-hosted, everxyz-win]
    env:
      MODE: ${{ needs.setup.outputs.mode }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout at ref
        run: |
          set -euo pipefail
          rm -rf src-linux && mkdir src-linux && cd src-linux
          git init --quiet
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD

      - name: Build in amd64 container
        env:
          # Docker Desktop's named pipe (dockerDesktopLinuxEngine) belongs to the
          # interactive user's session, so a service account cannot reach it even
          # when it is in docker-users. The TCP endpoint is session-independent.
          # Requires "Expose daemon on tcp://localhost:2375" in Docker Desktop.
          DOCKER_HOST: tcp://localhost:2375
        run: |
          set -euo pipefail
          rm -rf install-linux

          docker version --format 'daemon {{.Server.Version}}' >/dev/null || {
            echo "::error::Cannot reach the Docker daemon on ${DOCKER_HOST}."
            echo "Enable 'Expose daemon on tcp://localhost:2375 without TLS' in"
            echo "Docker Desktop settings, and make sure Docker Desktop is running."
            exit 1
          }

          # MSYS_NO_PATHCONV stops Git Bash rewriting the container-side paths in -v.
          export MSYS_NO_PATHCONV=1

          # Native x86_64 build: the runner host is amd64, so no emulation.
          docker run --rm --platform linux/amd64 \
            -v "$(pwd -W 2>/dev/null || pwd)/src-linux:/src:ro" \
            -v "$(pwd -W 2>/dev/null || pwd):/out" \
            -e MODE="$MODE" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake libx11-dev libxext-dev libxmu-dev libxi-dev \
                libgl1-mesa-dev libglu1-mesa-dev tcl-dev tk-dev
              cmake -S /src -B /tmp/build -G "Unix Makefiles" \
                -D CMAKE_BUILD_TYPE="$MODE" \
                -D BUILD_LIBRARY_TYPE=Shared \
                -D BUILD_CPP_STANDARD=C++17 \
                -D BUILD_MODULE_Draw=OFF \
                -D BUILD_DOC_Overview=OFF \
                -D USE_FREETYPE=OFF \
                -D USE_TK=OFF \
                -D USE_OPENGL=ON \
                -D INSTALL_DIR=/tmp/install
              cmake --build /tmp/build --target install -- -j"$(nproc)"
              cp -a /tmp/install /out/install-linux
            '

      - name: Package
        run: |
          set -euo pipefail
          name="occt-${VERSION}-linux-amd64-$(echo "$MODE" | tr '[:upper:]' '[:lower:]')"
          tar -czf "${name}.tar.gz" -C install-linux .
          echo "Created ${name}.tar.gz ($(du -h "${name}.tar.gz" | cut -f1))"
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src-linux/.github/scripts/upload-release-asset.sh "$ARCHIVE"
