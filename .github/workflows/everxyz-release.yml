# Builds everxyz OCCT binaries when an everxyz-release-* or everxyz-debug-* tag is
# pushed.
#
#   everxyz-release-*  ->  Release build (optimized)
#   everxyz-debug-*    ->  Debug build (assertions, debug symbols)
#
# Targets are Windows x64 (native MSVC) and Linux amd64 (x86_64 in a container).
# Both are native builds on the self-hosted runner labelled 'everxyz-win'.
#
# Deliberately uses no external actions: the repository's Actions policy is set to
# allow only everxyz-owned actions, so actions/checkout and friends are blocked.
# Checkout, archiving and release upload are done with git, tar and the REST API.
#
# Every host-side step runs in Windows PowerShell 5.1 ('shell: powershell'), which
# is the only shell that actually works on this runner:
#   - 'shell: bash' resolves through PATH to C:\Windows\System32\bash.exe, the WSL
#     launcher. WSL distros are registered per-user and the runner's service account
#     has none, so it exits immediately.
#   - Naming Git Bash by absolute path in 'shell:' makes the runner fail with
#     "Second path fragment must not be a drive or UNC name".
#   - 'shell: pwsh' needs PowerShell Core, which is not installed here.

name: everxyz Build

on:
  push:
    tags:
      - 'everxyz-release-*'
      - 'everxyz-debug-*'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode when run manually'
        type: choice
        options: [Release, Debug]
        default: Release
      targets:
        description: 'Which targets to build'
        type: choice
        options: [both, windows-x64, linux-amd64]
        default: both
      publish:
        description: 'Also publish to Aliyun OSS and GitHub Packages (tags do this automatically)'
        type: boolean
        default: false

# The repository default is read-only (default_workflow_permissions: read), so
# every scope has to be named here.
#   contents: write  -- create the release and upload its assets
#   packages: write  -- push the carrier image to ghcr.io
#   id-token: write  -- mint the OIDC token that Aliyun RAM federates on. Without
#                       it Actions injects no ACTIONS_ID_TOKEN_REQUEST_* pair and
#                       there is no way to reach OSS without a static AccessKey.
permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: everxyz-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Equivalent to 'shell: powershell' plus -ExecutionPolicy Bypass. The runner's
    # service account has no execution policy of its own (LocalMachine is Undefined,
    # i.e. Restricted), so the default would refuse to run the generated .ps1.
    # Bypass applies to this process only and changes nothing system-wide.
    # 'powershell' resolves via PATH here; naming an interpreter by absolute path
    # makes the runner fail with "Second path fragment must not be a drive name".
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  setup:
    name: Resolve build mode
    runs-on: [self-hosted, everxyz-win]
    if: github.repository != 'Open-Cascade-SAS/OCCT'
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      build_windows: ${{ steps.resolve.outputs.build_windows }}
      build_linux: ${{ steps.resolve.outputs.build_linux }}
    steps:
      - name: Resolve mode and version from tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_MODE: ${{ inputs.build_mode }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = $env:REF_NAME

          if ($ref -like 'everxyz-release-*') {
            $mode = 'Release'; $version = $ref.Substring('everxyz-release-'.Length)
          } elseif ($ref -like 'everxyz-debug-*') {
            $mode = 'Debug';   $version = $ref.Substring('everxyz-debug-'.Length)
          } else {
            # workflow_dispatch on a branch: fall back to the chosen input.
            $mode = if ($env:INPUT_MODE) { $env:INPUT_MODE } else { 'Release' }
            $version = "manual-$($env:GITHUB_SHA.Substring(0,8))"
          }

          $want = if ($env:INPUT_TARGETS) { $env:INPUT_TARGETS } else { 'both' }
          switch ($want) {
            'windows-x64' { $win = 'true';  $lnx = 'false' }
            'linux-amd64' { $win = 'false'; $lnx = 'true'  }
            default       { $win = 'true';  $lnx = 'true'  }
          }

          @(
            "mode=$mode"
            "version=$version"
            "build_windows=$win"
            "build_linux=$lnx"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT

          @(
            '## everxyz build'
            "- tag/ref: ``$ref``"
            "- mode: **$mode**"
            "- version: ``$version``"
            "- windows-x64: $win"
            "- linux-amd64: $lnx"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  windows-x64:
    name: Windows x64 (${{ needs.setup.outputs.mode }})
    needs: setup
    if: needs.setup.outputs.build_windows == 'true'
    runs-on: [self-hosted, everxyz-win]
    env:
      MODE: ${{ needs.setup.outputs.mode }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout at ref
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path src-win) { Remove-Item src-win -Recurse -Force }
          New-Item -ItemType Directory -Path src-win | Out-Null
          Push-Location src-win
          try {
            git init --quiet
            git remote add origin "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
            git fetch --quiet --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed ($LASTEXITCODE)" }
            git checkout --quiet FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "git checkout failed ($LASTEXITCODE)" }
          } finally { Pop-Location }

      - name: Configure
        run: |
          $ErrorActionPreference = 'Stop'
          # Headless CAD kernel: STEP/IGES import, BRep modelling, mesh generation.
          # No visualization.
          #
          # Every module is switched off and the capability toolkits are named
          # explicitly instead, so the dependency closure decides what gets built
          # rather than a module list dragging in everything beside it. TKOpenGl is
          # not reachable from this closure, so CAN_USE_OPENGL goes false and the
          # GL/GLES backends drop out on their own (CMakeLists.txt:531,663-672).
          #
          # TKFillet and TKOffset are not reachable from the reader/mesh set, so
          # they are named too: BRepFilletAPI and BRepOffsetAPI (fillet, chamfer,
          # sweep, loft, thick solid) are part of BRep construction.
          #
          # TKV3d and TKService still appear in the closure. They are link-level
          # dependencies of TKXCAF, which carries STEP assembly structure, colours
          # and names. They contain no GL code and need no display.
          cmake -S src-win -B build-win -G "Visual Studio 17 2022" -A x64 `
            -D CMAKE_BUILD_TYPE=$env:MODE `
            -D BUILD_LIBRARY_TYPE=Shared `
            -D BUILD_CPP_STANDARD=C++17 `
            -D BUILD_MODULE_FoundationClasses=OFF `
            -D BUILD_MODULE_ModelingData=OFF `
            -D BUILD_MODULE_ModelingAlgorithms=OFF `
            -D BUILD_MODULE_Visualization=OFF `
            -D BUILD_MODULE_ApplicationFramework=OFF `
            -D BUILD_MODULE_DataExchange=OFF `
            -D BUILD_MODULE_Draw=OFF `
            -D BUILD_ADDITIONAL_TOOLKITS="TKDESTEP;TKDEIGES;TKXCAF;TKMesh;TKFillet;TKOffset" `
            -D BUILD_DOC_Overview=OFF `
            -D USE_OPENGL=OFF `
            -D USE_FREETYPE=OFF `
            -D USE_TK=OFF `
            -D INSTALL_DIR="$PWD/install-win"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-win --target install --config $env:MODE --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "occt-$env:VERSION-windows-x64-$($env:MODE.ToLower())"
          $archive = "$name.tar.gz"
          tar -czf $archive -C install-win .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sizeMb = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          Write-Host "Created $archive ($sizeMb MB)"
          "ARCHIVE=$archive" | Add-Content -LiteralPath $env:GITHUB_ENV

          # Corresponding-source pointer for the release notes. OCCT is LGPL-2.1,
          # so distributing these binaries obliges us to say where the matching
          # source is. This fork changes nothing under src/, so the upstream tag
          # for the version in adm/cmake/version.cmake IS that source.
          #
          # Read from the tree rather than 'git describe': the checkout is shallow
          # and carries no tags. Anchored on 'set (' so the explanatory comment
          # block at the top of version.cmake cannot match first.
          $vf = Get-Content -LiteralPath src-win\adm\cmake\version.cmake -Raw
          $maj = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $mnt = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MAINTENANCE\s+(\d+)').Groups[1].Value
          # Absent in a release tree; present ('dev', 'rc1', 'p1') between releases,
          # where it becomes part of the tag name as in V8_0_0_p1.
          $dev = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_DEVELOPMENT\s+"?([^"\s\)]*)"?').Groups[1].Value
          $upstreamTag = ''
          if ($maj -and $min -and $mnt) {
            $upstreamTag = "V${maj}_${min}_${mnt}"
            if ($dev) { $upstreamTag = "${upstreamTag}_$dev" }
          }
          Write-Host "Upstream tag: $(if ($upstreamTag) { $upstreamTag } else { '(undetermined)' })"
          "UPSTREAM_TAG=$upstreamTag" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Publish to Aliyun OSS
        id: oss
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          # ARNs, not secrets: they name a role, they do not grant it. The trust
          # policy on the role is what decides whether this repository's OIDC
          # token is accepted, so publishing them is harmless.
          OCCT_OSS_ROLE_ARN: ${{ vars.OCCT_OSS_ROLE_ARN }}
          OCCT_OSS_OIDC_PROVIDER_ARN: ${{ vars.OCCT_OSS_OIDC_PROVIDER_ARN }}
          OCCT_OSS_BUCKET: ${{ vars.OCCT_OSS_BUCKET }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-win\.github\scripts\publish-oss.ps1 -Archive $env:ARCHIVE `
            -Platform windows-x64 -Mode $env:MODE -Version $env:VERSION

      - name: Publish to GitHub Packages
        id: ghcr
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed even in this native-Windows job: the carrier image is built by
          # the Linux daemon. Same vendored-CLI reasoning as the linux-amd64 job.
          DOCKER_HOST: tcp://localhost:2375
          DOCKER_CLI: F:\actions-runner\tools\docker.exe
          OCCT_GHCR_INDEX_ONLY: ${{ vars.OCCT_GHCR_INDEX_ONLY }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-win\.github\scripts\publish-ghcr.ps1 -Archive $env:ARCHIVE `
            -Platform windows-x64 -Mode $env:MODE -Version $env:VERSION `
            -OssBucket '${{ steps.oss.outputs.oss_bucket }}' `
            -OssObjectKey '${{ steps.oss.outputs.oss_object_key }}' `
            -Sha256 '${{ steps.oss.outputs.oss_sha256 }}'

      # Last of the three, because it indexes the other two: it records the OSS
      # coordinates and the GHCR reference, so both have to have run. It also
      # attaches the archive itself, which is the only retrieval path that is a
      # plain URL a browser can follow.
      #
      # UPSTREAM_TAG comes from the Package step via GITHUB_ENV and drives the LGPL
      # corresponding-source link. It is the upstream tag this fork is based on, not
      # the everxyz release tag: we distribute unmodified library binaries, so it is
      # upstream's tarball that is the matching source.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-win\.github\scripts\upload-release-asset.ps1 $env:ARCHIVE `
            -Bucket '${{ steps.oss.outputs.oss_bucket }}' `
            -ObjectKey '${{ steps.oss.outputs.oss_object_key }}' `
            -Sha256 '${{ steps.oss.outputs.oss_sha256 }}' `
            -Region '${{ steps.oss.outputs.oss_region }}' `
            -Endpoint '${{ steps.oss.outputs.oss_endpoint }}' `
            -GhcrReference '${{ steps.ghcr.outputs.ghcr_ref }}' `
            -UpstreamTag $env:UPSTREAM_TAG

  linux-amd64:
    name: Linux amd64 (${{ needs.setup.outputs.mode }})
    needs: setup
    if: needs.setup.outputs.build_linux == 'true'
    runs-on: [self-hosted, everxyz-win]
    env:
      MODE: ${{ needs.setup.outputs.mode }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout at ref
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path src-linux) { Remove-Item src-linux -Recurse -Force }
          New-Item -ItemType Directory -Path src-linux | Out-Null
          Push-Location src-linux
          try {
            git init --quiet
            git remote add origin "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
            git fetch --quiet --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed ($LASTEXITCODE)" }
            git checkout --quiet FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "git checkout failed ($LASTEXITCODE)" }
          } finally { Pop-Location }

      - name: Build in amd64 container
        env:
          # Docker Desktop's named pipe (dockerDesktopLinuxEngine) belongs to the
          # interactive user's session, so a service account cannot reach it even
          # when it is in docker-users. The TCP endpoint is session-independent.
          # Requires "Expose daemon on tcp://localhost:2375" in Docker Desktop.
          DOCKER_HOST: tcp://localhost:2375
          # Docker Desktop ships its CLI under 'C:\Program Files\Docker', but on this
          # host every exe there had its inherited 'BUILTIN\Users' read+execute entry
          # stripped and its owner reset to the interactive user, so the runner account
          # gets "Access is denied" merely trying to launch docker.exe. The CLI is a
          # self-contained Go binary with no external DLLs, so a copy the runner account
          # can execute works identically. Point this at that copy.
          DOCKER_CLI: F:\actions-runner\tools\docker.exe
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path install-linux) { Remove-Item install-linux -Recurse -Force }

          # Prefer the readable copy; fall back to PATH where the ACLs are intact.
          $docker = $env:DOCKER_CLI
          if (-not ($docker -and (Test-Path -LiteralPath $docker))) {
            $onPath = (Get-Command docker -ErrorAction SilentlyContinue).Source
            if (-not $onPath) {
              Write-Host "::error::No docker CLI found (DOCKER_CLI unset/missing, none on PATH)."
              exit 1
            }
            $docker = $onPath
          }
          Write-Host "docker CLI: $docker"

          & $docker version --format 'daemon {{.Server.Version}}' | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Cannot reach the Docker daemon on $env:DOCKER_HOST."
            Write-Host "Enable 'Expose daemon on tcp://localhost:2375 without TLS' in"
            Write-Host "Docker Desktop settings, and make sure Docker Desktop is running."
            exit 1
          }

          # The build script is written to disk with LF endings and mounted, rather
          # than passed via 'bash -c'. PowerShell 5.1 truncates arguments containing
          # embedded newlines when invoking a native program, so an inline script
          # silently reaches the container as its first line only.
          $build = @(
            'set -eo pipefail'
            'export DEBIAN_FRONTEND=noninteractive'
            'apt-get update -qq'
            # No X11, GL or Tcl/Tk headers: this is a headless kernel build and
            # nothing in the toolkit closure links against them.
            'apt-get install -y -qq --no-install-recommends build-essential cmake'
            # Headless CAD kernel: STEP/IGES import, BRep modelling, mesh
            # generation. No visualization. See the Windows job for why the
            # toolkits are named individually and why TKV3d/TKService remain.
            # USE_XLIB is additionally forced off here because it defaults to ON
            # on Linux (CMakeLists.txt:392-394), unlike on Windows.
            'cmake -S /src -B /tmp/build -G "Unix Makefiles" \'
            '  -D CMAKE_BUILD_TYPE="$MODE" \'
            '  -D BUILD_LIBRARY_TYPE=Shared \'
            '  -D BUILD_CPP_STANDARD=C++17 \'
            '  -D BUILD_MODULE_FoundationClasses=OFF \'
            '  -D BUILD_MODULE_ModelingData=OFF \'
            '  -D BUILD_MODULE_ModelingAlgorithms=OFF \'
            '  -D BUILD_MODULE_Visualization=OFF \'
            '  -D BUILD_MODULE_ApplicationFramework=OFF \'
            '  -D BUILD_MODULE_DataExchange=OFF \'
            '  -D BUILD_MODULE_Draw=OFF \'
            '  -D BUILD_ADDITIONAL_TOOLKITS="TKDESTEP;TKDEIGES;TKXCAF;TKMesh;TKFillet;TKOffset" \'
            '  -D BUILD_DOC_Overview=OFF \'
            '  -D USE_OPENGL=OFF \'
            '  -D USE_XLIB=OFF \'
            '  -D USE_FREETYPE=OFF \'
            '  -D USE_TK=OFF \'
            '  -D INSTALL_DIR=/tmp/install'
            'cmake --build /tmp/build --target install -- -j"$(nproc)"'
            'cp -a /tmp/install /out/install-linux'
          ) -join "`n"

          # Docker needs Windows-style host paths, which (Get-Location).Path gives.
          $here = (Get-Location).Path
          $scriptPath = Join-Path $here 'container-build.sh'
          [System.IO.File]::WriteAllText($scriptPath, $build + "`n",
                                         (New-Object System.Text.UTF8Encoding($false)))

          # Native x86_64 build: the runner host is amd64, so no emulation.
          & $docker @(
            'run','--rm','--platform','linux/amd64',
            '-v', "${here}\src-linux:/src:ro",
            '-v', "${here}:/out",
            '-v', "${scriptPath}:/build.sh:ro",
            '-e', "MODE=$env:MODE",
            'ubuntu:22.04','bash','/build.sh'
          )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "occt-$env:VERSION-linux-amd64-$($env:MODE.ToLower())"
          $archive = "$name.tar.gz"
          tar -czf $archive -C install-linux .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sizeMb = [math]::Round((Get-Item $archive).Length / 1MB, 1)
          Write-Host "Created $archive ($sizeMb MB)"
          "ARCHIVE=$archive" | Add-Content -LiteralPath $env:GITHUB_ENV

          # See the windows-x64 job for why this is read from the tree.
          $vf = Get-Content -LiteralPath src-linux\adm\cmake\version.cmake -Raw
          $maj = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $min = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MINOR\s+(\d+)').Groups[1].Value
          $mnt = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_MAINTENANCE\s+(\d+)').Groups[1].Value
          $dev = [regex]::Match($vf, 'set\s*\(\s*OCC_VERSION_DEVELOPMENT\s+"?([^"\s\)]*)"?').Groups[1].Value
          $upstreamTag = ''
          if ($maj -and $min -and $mnt) {
            $upstreamTag = "V${maj}_${min}_${mnt}"
            if ($dev) { $upstreamTag = "${upstreamTag}_$dev" }
          }
          Write-Host "Upstream tag: $(if ($upstreamTag) { $upstreamTag } else { '(undetermined)' })"
          "UPSTREAM_TAG=$upstreamTag" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Publish to Aliyun OSS
        id: oss
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          OCCT_OSS_ROLE_ARN: ${{ vars.OCCT_OSS_ROLE_ARN }}
          OCCT_OSS_OIDC_PROVIDER_ARN: ${{ vars.OCCT_OSS_OIDC_PROVIDER_ARN }}
          OCCT_OSS_BUCKET: ${{ vars.OCCT_OSS_BUCKET }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-linux\.github\scripts\publish-oss.ps1 -Archive $env:ARCHIVE `
            -Platform linux-amd64 -Mode $env:MODE -Version $env:VERSION

      - name: Publish to GitHub Packages
        id: ghcr
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HOST: tcp://localhost:2375
          DOCKER_CLI: F:\actions-runner\tools\docker.exe
          OCCT_GHCR_INDEX_ONLY: ${{ vars.OCCT_GHCR_INDEX_ONLY }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-linux\.github\scripts\publish-ghcr.ps1 -Archive $env:ARCHIVE `
            -Platform linux-amd64 -Mode $env:MODE -Version $env:VERSION `
            -OssBucket '${{ steps.oss.outputs.oss_bucket }}' `
            -OssObjectKey '${{ steps.oss.outputs.oss_object_key }}' `
            -Sha256 '${{ steps.oss.outputs.oss_sha256 }}'

      # Last of the three, because it indexes the other two. See the windows-x64
      # job for why, and for what UPSTREAM_TAG is.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & src-linux\.github\scripts\upload-release-asset.ps1 $env:ARCHIVE `
            -Bucket '${{ steps.oss.outputs.oss_bucket }}' `
            -ObjectKey '${{ steps.oss.outputs.oss_object_key }}' `
            -Sha256 '${{ steps.oss.outputs.oss_sha256 }}' `
            -Region '${{ steps.oss.outputs.oss_region }}' `
            -Endpoint '${{ steps.oss.outputs.oss_endpoint }}' `
            -GhcrReference '${{ steps.ghcr.outputs.ghcr_ref }}' `
            -UpstreamTag $env:UPSTREAM_TAG
