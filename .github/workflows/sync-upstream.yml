# Keeps this fork (everxyz/OCCT) in step with Open-Cascade-SAS/OCCT once per day.
#
# The branch topology this maintains:
#   master           everxyz's own release line. Never synced -- upstream reaches it
#                    by a deliberate merge, by hand, not on a schedule.
#   upstreamSAS      a clean mirror of upstream's default branch, fast-forward only.
#   everything else  synced against the upstream branch of the same name.
#
# Name-matched branches go through the REST merge-upstream endpoint rather than a
# push. GITHUB_TOKEN is forbidden from pushing commits that touch .github/workflows,
# and upstream edits those files regularly, so a plain `git push` sync would start
# failing the first time a workflow file changed upstream. merge-upstream is
# performed by GitHub server-side and is not subject to that restriction.
#
# upstreamSAS cannot use merge-upstream, which only ever merges the upstream branch
# of the same name and upstream has no 'upstreamSAS'. It is advanced by pointing its
# ref at upstream's tip through the git refs API instead -- also server-side, and
# creating no commit.
#
# Nothing here force-updates a ref: diverged branches and moved tags are reported
# in the run summary and left alone rather than overwritten.

name: Sync Fork with Upstream

on:
  schedule:
    # 17:43 UTC daily (01:43 next day at UTC+8). Off-hour to avoid runner contention.
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: Open-Cascade-SAS/OCCT
  # Branches this fork owns. Held back from the merge-upstream loop even when
  # upstream has a branch of the same name. Space-separated.
  OWN_BRANCHES: master
  # Mirror of upstream's default branch, maintained by its own step below.
  MIRROR_BRANCH: upstreamSAS
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  sync:
    name: Sync branches and tags
    runs-on: ubuntu-latest
    # Guard so this never runs if the file is ever merged into the upstream repo.
    if: github.repository != 'Open-Cascade-SAS/OCCT'

    steps:
      - name: Sync branches via merge-upstream
        run: |
          set -uo pipefail

          gh api "repos/$UPSTREAM/branches" --paginate --jq '.[].name' | sort -u > upstream.txt
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' | sort -u > fork.txt

          synced=(); current=(); conflict=(); missing=(); held=()

          while read -r branch; do
            # Branches this fork owns are never merged into from upstream.
            case " $OWN_BRANCHES " in
              *" $branch "*) held+=("$branch"); continue ;;
            esac

            if ! grep -qxF "$branch" fork.txt; then
              missing+=("$branch")
              continue
            fi

            # 409 = merge conflict, 422 = anything else (e.g. protected branch).
            if out=$(gh api --method POST \
                       "repos/$GITHUB_REPOSITORY/merge-upstream" \
                       -f "branch=$branch" --jq '.merge_type' 2>&1); then
              case "$out" in
                none) current+=("$branch") ;;
                *)     synced+=("$branch:$out") ;;
              esac
            else
              conflict+=("$branch")
              echo "::warning::Could not sync '$branch': $out"
            fi
          done < upstream.txt

          {
            echo "## Branches"
            echo "- synced: ${#synced[@]} ${synced[*]:-}"
            echo "- already current: ${#current[@]}"
            echo "- failed / diverged: ${#conflict[@]} ${conflict[*]:-}"
            echo "- present upstream but not in this fork: ${#missing[@]} ${missing[*]:-}"
            echo "- held back as ours: ${#held[@]} ${held[*]:-}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#conflict[@]} -gt 0 ]; then
            echo "::warning::Branches needing manual attention: ${conflict[*]}"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::New upstream branches to create manually: ${missing[*]}"
          fi

      - name: Fast-forward the upstream mirror branch
        run: |
          set -uo pipefail

          up_default=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          sha=$(gh api "repos/$UPSTREAM/commits/$up_default" --jq '.sha')

          # A fork shares its object store with the parent, so upstream's tip is
          # already present here: the ref moves without fetching or pushing anything.
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/refs/heads/$MIRROR_BRANCH" 2>/dev/null; then
            # force=false keeps this fast-forward-only. A diverged mirror is rejected
            # and reported rather than reset, which is the rule everywhere else here.
            if out=$(gh api --method PATCH \
                       "repos/$GITHUB_REPOSITORY/git/refs/heads/$MIRROR_BRANCH" \
                       -f "sha=$sha" -F force=false --jq '.object.sha' 2>&1); then
              result="advanced to ${out:0:10}"
            else
              result="could not be advanced: $out"
              echo "::warning::$MIRROR_BRANCH $result"
            fi
          else
            if out=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                       -f "ref=refs/heads/$MIRROR_BRANCH" -f "sha=$sha" \
                       --jq '.object.sha' 2>&1); then
              result="created at ${out:0:10}"
            else
              result="could not be created: $out"
              echo "::warning::$MIRROR_BRANCH $result"
            fi
          fi

          {
            echo "## Mirror branch"
            echo "- $MIRROR_BRANCH $result (tracking $UPSTREAM@$up_default)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync tags
        run: |
          set -uo pipefail

          # A bare mirror-style fetch keeps this cheap: refs and trees only, no checkout.
          git init --quiet tagsync
          cd tagsync
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --filter=blob:none --no-tags upstream 'refs/tags/*:refs/tags/*'

          git ls-remote --tags origin \
            | sed -n 's|.*refs/tags/\([^^]*\)$|\1|p' | sort -u > have.txt

          new=()
          while read -r tag; do
            grep -qxF "$tag" have.txt || new+=("$tag")
          done < <(git tag --list)

          if [ ${#new[@]} -eq 0 ]; then
            echo "## Tags" >> "$GITHUB_STEP_SUMMARY"
            echo "- no new tags" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No --force, so a tag upstream has moved is rejected instead of rewritten.
          if git push origin "${new[@]/#/refs/tags/}"; then
            {
              echo "## Tags"
              echo "- pushed: ${#new[@]} ${new[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Tag push failed for: ${new[*]}"
            {
              echo "## Tags"
              echo "- push failed: ${new[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
